<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0088ff" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridPat" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="550" rx="30" fill="url(#cyberBg)" />
  <rect width="500" height="550" rx="30" fill="url(#gridPat)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="180" r="120" fill="#00f0ff" opacity="0.12" filter="url(#neonGlow)"/>
  <circle cx="360" cy="380" r="140" fill="#9d4edd" opacity="0.1" filter="url(#neonGlow)"/>

  <!-- Futuristic HUD Concentric Circles -->
  <circle cx="250" cy="240" r="170" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" stroke-dasharray="10 14" />
  <circle cx="250" cy="240" r="195" fill="none" stroke="rgba(157, 78, 221, 0.15)" stroke-width="1" stroke-dasharray="6 8" />
  <circle cx="250" cy="240" r="145" fill="none" stroke="rgba(0, 255, 157, 0.25)" stroke-width="1" />

  <!-- Developer Silhouette with Cyber Elements -->
  <g transform="translate(250, 240)">
    <!-- Shoulders / Cyber Jacket -->
    <path d="M -130 190 C -110 120, -70 90, 0 90 C 70 90, 110 120, 130 190 Z" fill="#131c33" stroke="rgba(0, 240, 255, 0.3)" stroke-width="2"/>
    
    <!-- Neon Collar Highlights -->
    <path d="M -50 95 L 0 145 L 50 95" fill="none" stroke="url(#neonCyan)" stroke-width="3" filter="url(#neonGlow)"/>
    <path d="M 0 145 L 0 190" fill="none" stroke="url(#neonCyan)" stroke-width="2"/>

    <!-- Neck -->
    <rect x="-24" y="30" width="48" height="65" rx="10" fill="#1e293b" />

    <!-- Head / Hair Silhouette -->
    <ellipse cx="0" cy="0" rx="60" ry="75" fill="#1e293b" />
    <!-- Styled Modern Hair Cut -->
    <path d="M -62 -15 C -65 -65, -30 -85, 10 -85 C 50 -85, 68 -55, 62 -5 C 50 -35, 20 -45, -15 -40 C -45 -35, -55 -25, -62 -15 Z" fill="#0f172a" />
    <path d="M -45 -60 C -10 -80, 40 -80, 60 -50" fill="none" stroke="url(#neonPurple)" stroke-width="3" filter="url(#neonGlow)" />

    <!-- Futuristic Cyber Visor / Smart Glasses -->
    <path d="M -52 -5 C -40 -12, 40 -12, 52 -5 L 48 16 C 30 20, -30 20, -48 16 Z" fill="rgba(0, 240, 255, 0.25)" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#neonGlow)" />
    
    <!-- Visor Data Scan Beam -->
    <line x1="-40" y1="5" x2="40" y2="5" stroke="#ffffff" stroke-width="2" opacity="0.9" filter="url(#neonGlow)" />
    <circle cx="28" cy="5" r="3" fill="#00ff9d" />
  </g>

  <!-- HUD Corner Markers & Brackets -->
  <path d="M 25 50 L 25 25 L 50 25" fill="none" stroke="url(#neonCyan)" stroke-width="3" />
  <path d="M 475 50 L 475 25 L 450 25" fill="none" stroke="url(#neonCyan)" stroke-width="3" />
  <path d="M 25 500 L 25 525 L 50 525" fill="none" stroke="url(#neonCyan)" stroke-width="3" />
  <path d="M 475 500 L 475 525 L 450 525" fill="none" stroke="url(#neonCyan)" stroke-width="3" />

  <!-- Monospaced Code & System Text Overlay -->
  <text x="45" y="60" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f0ff" letter-spacing="2">DEV // MRINAL_PANDEY</text>
  <text x="45" y="80" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8" letter-spacing="1">SYSTEM_ID: JECRC-CSE-01</text>
  <text x="455" y="60" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00ff9d">ONLINE ●</text>

  <rect x="40" y="475" width="420" height="42" rx="10" fill="rgba(10, 15, 28, 0.85)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
  <text x="60" y="501" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">INIT &gt; B.TECH CSE CORE // BUILDER</text>
  <text x="435" y="501" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00f0ff">v2.4_READY</text>
</svg>
