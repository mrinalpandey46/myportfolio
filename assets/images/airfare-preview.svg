<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090f1d" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#00ff9d" />
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 240, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 240, 255, 0.0)" />
    </linearGradient>
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1.5"/>

  <!-- Top Terminal Header -->
  <rect width="600" height="42" rx="16" fill="rgba(255, 255, 255, 0.03)" />
  <circle cx="28" cy="21" r="5" fill="#ff5f56" />
  <circle cx="44" cy="21" r="5" fill="#ffbd2e" />
  <circle cx="60" cy="21" r="5" fill="#27c93f" />

  <text x="300" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1">AIRFARE_INDEX // REAL-TIME METRICS & PREDICTIVE ANALYTICS</text>
  <text x="560" y="26" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00ff9d">LIVE ●</text>

  <!-- Route Nodes Box -->
  <rect x="25" y="60" width="550" height="60" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
  
  <text x="50" y="85" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#ffffff">DEL</text>
  <text x="50" y="103" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">NEW DELHI</text>

  <!-- Route Flight Path -->
  <path d="M 125 90 C 220 55, 360 55, 455 90" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-dasharray="4 6"/>
  <!-- Airplane Icon -->
  <g transform="translate(290, 62) rotate(6)">
    <path d="M 0 0 L 12 -4 L 16 0 L 8 4 L 6 12 L 2 10 L 3 4 L -4 4 L -6 8 L -9 8 L -8 3 L -12 0 Z" fill="#00f0ff" filter="url(#neonFilter)"/>
  </g>

  <text x="530" y="85" text-anchor="end" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#ffffff">BOM</text>
  <text x="530" y="103" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">MUMBAI</text>

  <!-- Key Metrics Badges -->
  <g transform="translate(25, 135)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="170" height="65" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1"/>
    <text x="16" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">CURRENT INDEX</text>
    <text x="16" y="50" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#00f0ff">142.8 <tspan font-size="12" fill="#00ff9d">▲ 3.2%</tspan></text>

    <!-- Metric 2 -->
    <rect x="190" y="0" width="170" height="65" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(157, 78, 221, 0.2)" stroke-width="1"/>
    <text x="206" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">ESTIMATED FARE</text>
    <text x="206" y="50" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="20" fill="#fff">₹ 4,820</text>

    <!-- Metric 3 -->
    <rect x="380" y="0" width="170" height="65" rx="8" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(0, 255, 157, 0.2)" stroke-width="1"/>
    <text x="396" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">OPTIMAL BOOKING</text>
    <text x="396" y="50" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="17" fill="#00ff9d">BUY NOW [RECOMMENDED]</text>
  </g>

  <!-- Graph Grid & Trend Curve -->
  <g transform="translate(25, 215)">
    <!-- Grid Lines -->
    <line x1="0" y1="20" x2="550" y2="20" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <line x1="0" y1="60" x2="550" y2="60" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <line x1="0" y1="100" x2="550" y2="100" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <line x1="0" y1="130" x2="550" y2="130" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Area Fill -->
    <path d="M 20 110 Q 90 125, 160 85 T 300 95 T 430 40 T 530 30 L 530 130 L 20 130 Z" fill="url(#areaFill)"/>

    <!-- Smooth Trend Line -->
    <path d="M 20 110 Q 90 125, 160 85 T 300 95 T 430 40 T 530 30" fill="none" stroke="url(#curveGrad)" stroke-width="3" filter="url(#neonFilter)"/>

    <!-- Data Nodes on Curve -->
    <circle cx="20" cy="110" r="4" fill="#00f0ff"/>
    <circle cx="160" cy="85" r="4" fill="#00f0ff"/>
    <circle cx="300" cy="95" r="4" fill="#9d4edd"/>
    <circle cx="430" cy="40" r="5" fill="#00ff9d" stroke="#ffffff" stroke-width="2"/>
    <circle cx="530" cy="30" r="4" fill="#00ff9d"/>

    <!-- Timeline Labels -->
    <text x="20" y="146" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">DAY -14</text>
    <text x="160" y="146" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">DAY -10</text>
    <text x="300" y="146" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">DAY -7</text>
    <text x="430" y="146" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00ff9d">DAY -3 [SURGE]</text>
    <text x="520" y="146" font-family="'JetBrains Mono', monospace" font-size="9" fill="#64748b">DEP</text>
  </g>
</svg>
